name: siginex-ci

on:
  push:
  pull_request:

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Hidratar KB
        run: python siginex_kb_export.py siginex-autodiagnostico-500.html
      - name: Evals del agente (compuerta 8/8)
        run: python siginex_evals.py siginex-autodiagnostico-500.html
